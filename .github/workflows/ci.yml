name: CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - 'theme/src/**'
      - 'theme/static/**'
      - 'theme/index.theme'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'web/**'
      - 'theme/src/**'
      - 'theme/static/**'
      - 'theme/index.theme'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Install dependencies
        run: composer install --no-interaction --working-dir=web

      - name: Check formatting
        run: make -C web check

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          make -C web ci

      - name: Run migrations
        run: make -C web migrate
        background: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@6c5d5cfde33555ebd3e0172ba547497890c4b1c0

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --dir web --non-interactive --no-wait --build-remote --token "$WASMER_TOKEN"
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}

  deploy-mydevil:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      # Runtime dependencies only, built here and uploaded (MyDevil serves the
      # files as-is, there is no build step on the server).
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --working-dir=web

      # Generates icons.json, icons-stats.json, per-variant icons and favicon.
      - name: Build generated assets
        run: make -C web ci

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Stream web/ over SSH and extract on the server. tar-extract overwrites
      # changed files but never deletes, so the server-side .env is preserved.
      # .env* are excluded so local/dev secrets are never uploaded.
      - name: Deploy to MyDevil
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: tar -czf - --exclude='./.env' --exclude='./.env.local' --exclude='./.env.local.example' -C web . | ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }} "cd ${{ secrets.SSH_PATH }} && tar -xzf -"
